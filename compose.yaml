services:
  app:
    build: .
    environment:
      CATALOGUE_SOURCE: ${CATALOGUE_SOURCE:-fake-store}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-catalogue@example.test}
      SALES_EMAIL: ${SALES_EMAIL:-sales@example.test}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"
